<div class="min-h-screen flex items-center justify-center bg-slate-50 p-4">
  <div class="w-full max-w-md rounded-2xl bg-white p-6 sm:p-8 shadow-sm border border-slate-100">

    <div class="mb-8 text-center">
      <div class="mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-2xl bg-green-100 text-3xl">
        🛒
      </div>

      <h1 class="text-3xl font-bold text-green-700">Savora</h1>
      <p class="mt-2 text-sm text-slate-500">
        Smarter grocery shopping, better savings.
      </p>
    </div>

    <h2 class="mb-2 text-xl font-semibold">Welcome back</h2>
    <p class="mb-6 text-sm text-slate-500">
      Sign in to your household account.
    </p>

    <form (ngSubmit)="submit()" class="space-y-4">

      <div>
        <label class="mb-1 block text-sm font-medium">Email</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          autocomplete="email"
          placeholder="you@example.com"
          class="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:border-green-600 focus:ring-2 focus:ring-green-100"
        />
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium">Password</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          autocomplete="current-password"
          placeholder="Enter password"
          class="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:border-green-600 focus:ring-2 focus:ring-green-100"
        />
      </div>

      <div
        *ngIf="error"
        class="rounded-lg bg-red-50 p-3 text-sm text-red-600"
      >
        {{ error }}
      </div>

      <button
        type="submit"
        [disabled]="loading"
        class="w-full rounded-xl bg-green-600 py-3 font-semibold text-white transition hover:bg-green-700 disabled:opacity-50"
      >
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>

    </form>

    <p class="mt-6 text-center text-sm text-slate-500">
      Don't have an account?
      <a
        routerLink="/register"
        class="font-semibold text-green-700"
      >
        Create account
      </a>
    </p>

  </div>
</div>
